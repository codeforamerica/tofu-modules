[project]
site_name = "Code for America OpenTofu Modules"
repo_url = "https://github.com/codeforamerica/tofu-modules"
repo_name = "codeforamerica/tofu-modules"
edit_uri = "edit/main/docs/"
copyright = "Produced by Code for America under the MIT license."

nav = [
  { "Home" = "index.md" },
  { "Architecture" = [
    "architecture/index.md",
    "architecture/create.md",
    "architecture/github-actions.md",
  ]},
  { "Modules" = [
    { "Aptible" = [
      "modules/aptible/managed-endpoint.md",
    ]},
    { "AWS" = [
      "modules/aws/backend.md",
      "modules/aws/cloudfront-redirect.md",
      "modules/aws/cloudfront-waf.md",
      { "Doppler" = [
        "modules/aws/doppler/index.md",
        "modules/aws/doppler/modules/sync.md",
      ]},
      "modules/aws/fargate-service.md",
      "modules/aws/logging.md",
      "modules/aws/secrets.md",
      "modules/aws/serverless-database.md",
      "modules/aws/ses.md",
      "modules/aws/ssm-bastion.md",
      "modules/aws/ssm-inputs.md",
      "modules/aws/ssm-outputs.md",
      "modules/aws/vpc.md",
    ]},
    { "Datadog" = [
      "modules/datadog/sensitive-data-scanner.md",
      "modules/datadog/waf.md",
    ]},
  ]},
  { "About" = [
    "about/index.md",
    "about/license.md",
  ]},
]

[project.theme]
features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.select",
  "navigation.path",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "toc.integrate",
]

[project.theme.icon]
logo = "simple/opentofu"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[[project.extra.social]]
icon = "material/web"
link = "https://codeforamerica.org/"
name = "Code for America website"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/codeforamerica"
name = "Code for America on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/threads"
link = "https://www.threads.net/@codeforamerica"
name = "Code for America on Threads"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/codeforamerica.org"
name = "Code for America on Bluesky"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.github-callouts]
[project.markdown_extensions.footnotes]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = "."

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
