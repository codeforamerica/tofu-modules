name: Deploy to shared documentation hosting

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to.
        default: docs-dev
        required: true
        type: environment
  push:
    paths:
      # Only trigger on changes to documentation files.
      - 'docs/**'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yaml'
      - '*.md'
    branches:
      - main

permissions:
  contents: read

run-name: Deploy documentation to ${{ inputs.environment || 'docs-dev' }}

jobs:
  build:
    # We need to copy assets from submodules, so we can't use the shared
    # Zensical build workflow.
    name: Build documentation
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Copy assets from submodules
        run: rsync -av --progress */**/docs/assets/ docs/assets --exclude .git --exclude .idea --exclude docs
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build documentation
        run: uv run --locked zensical build
      - name: Upload built site
        uses: actions/upload-artifact@v7
        id: upload
        with:
          name: documentation
          path: site
          if-no-files-found: error

  deploy:
    needs: build
    uses: codeforamerica/github-actions/.github/workflows/shared-services-documentation-deploy.yaml@main
    permissions:
      contents: read
      id-token: write
    with:
      artifact-ids: ${{ needs.build.outputs.artifact-id }}
      environment: ${{ inputs.environment || 'docs-dev' }}
    secrets: inherit
